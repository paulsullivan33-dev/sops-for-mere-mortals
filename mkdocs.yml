site_name: SOPS for Mere Mortals
site_description: An editor for files whose values are secret. Sealing YAML, JSON and dotenv files with age keys so they can live safely in git, choosing keys by path with creation rules, changing keyholders over time, and feeding secrets to scripts without leaving plain text on disk, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/sops-for-mere-mortals/
